apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: mcp-hr-chaos-engine
  namespace: staging
spec:
  engineState: "active"
  annotationCheck: "false"
  jobCleanUpPolicy: 'retain'          # 保留 ChaosResult，便于 Jenkins 读取 verdict
  appinfo:
    appns: "staging"
    applabel: "app.kubernetes.io/name=myapp"
    appkind: "rollout"                # 保持 rollout，因为应用由 Argo Rollouts 管理
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-network-latency
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: '60'             # 混沌持续 60 秒
            - name: NETWORK_LATENCY
              value: '2000'           # 注入 2000ms（2秒）延迟
            - name: TARGET_CONTAINER
              value: 'myapp'          # 指定目标容器名称（根据你的实际容器名调整）
            - name: NETWORK_INTERFACE
              value: 'eth0'           # 默认网卡接口
            - name: JITTER
              value: '0'              # 延迟抖动，0 表示固定延迟
            - name: PODS_AFFECTED_PERC
              value: '100'            # 影响 100% 的目标 Pod
