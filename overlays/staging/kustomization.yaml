apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

patches:
  - target:
      kind: Rollout
      name: myapp
    path: rollout-patch.yaml
  - target:
      kind: Ingress
      name: myapp
    path: ingress-patch.yaml
  - target:
      kind: HorizontalPodAutoscaler
      name: myapp-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5
      - op: replace
        path: /spec/metrics/0/resource/target/averageUtilization
        value: 70
      - op: replace
        path: /spec/behavior
        value:
          scaleUp:
            stabilizationWindowSeconds: 60
            policies:
              - type: Percent
                value: 100
                periodSeconds: 60
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - type: Percent
                value: 25
                periodSeconds: 60

images:
  - name: 192.168.30.11:30003/library/mcp-hr-server
    newTag: c37282e

configMapGenerator:
  - name: myapp-config
    behavior: merge
    literals:
      - app_env=staging
      - log_level=info
      - max_requests=500
