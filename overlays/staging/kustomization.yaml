patches:
  - target:
      kind: Rollout
      name: myapp
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/strategy/canary/maxSurge
        value: "50%"
      - op: replace
        path: /spec/strategy/canary/steps
        value:
          - setWeight: 50
          - pause: { duration: 30s }
          - setWeight: 100
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
  - path: hpa-patch.yaml
  - path: ingress-patch.yaml
